st-fit lender. Sheffield excels at commercial, Synchrony offers promotional consumer rates, and Hometowne is flexible on credit history.`})]})})]})]})})]})}var Mf=[{id:`bolt`,keywords:[`bolt`,`hub`,`lug`,`bolt pattern`,`stud`],label:`Hub Bolt Patterns`,category:`specs`,answer:`Hub Bolt Pattern Reference:

• 5 on 4.5" — 2,000–3,500 lb axles (light utility, small cargo)
• 5 on 5" — 3,500 lb axles (mid-range bumper pull)
• 6 on 5.5" — 5,200–6,000 lb axles (heavy utility, equipment)
• 8 on 6.5" — 7,000–8,000 lb axles (dump, gooseneck, heavy equipment)

How to measure: For even bolt counts, measure center-to-center across opposite studs. For 5-bolt, measure from center of one stud to far edge of the opposite stud.

⚠️ A wheel that "almost fits" a different bolt pattern can appear to mount but will wobble and eventually fail. Always verify before you buy.`},{id:`rim`,keywords:[`rim`,`16.5`,`tire size`,`16 inch`,`rim size`,`bead`],label:`16" vs 16.5" Rims`,category:`safety`,answer:`⚠️ CRITICAL SAFETY WARNING: 16" and 16.5" Rims

16" and 16.5" rims are NOT interchangeable. A 16" tire mounted on a 16.5" rim will NOT seat on the bead properly. Under load, the tire can blow off the rim without warning — at highway speed, this can be fatal.

• 16" rims — Standard for most trailer applications (ST235/80R16)
• 16.5" rims — Found on some commercial/older trailers (235/75R17.5)

Always measure the actual rim diameter. Do NOT rely on tire sidewall markings alone if the rim is unmarked. When in doubt, take the wheel to a tire shop for measurement.`},{id:`wiring`,keywords:[`7-pin`,`7 pin`,`wiring diagram`,`connector`,`pin color`,`wire color`],label:`7-Pin Wiring Diagram`,category:`repair`,answer:`7-Pin Trailer Wiring Diagram (Standard Connector):

Pin 1 (White) — Ground
Pin 2 (Blue) — Electric Brakes
Pin 3 (Green) — Right Turn / Brake
Pin 4 (Brown) — Running Lights / Tail
Pin 5 (Yellow) — Left Turn / Brake
Pin 6 (Red) — 12V Battery / Charge
Pin 7 (Orange/Black) — Auxiliary / Backup Lights

Troubleshooting: If brakes engage on only one side, check Pin 3 and Pin 5 for shorts or swapped connections. A crossed left/right can cause jackknife under braking.

⚠️ If your trailer weighs over 1,500 lbs loaded, it legally requires its own braking system in most states.`},{id:`bearing`,keywords:[`bearing`,`repack`,`grease`,`hub service`,`spindle`,`seal`],label:`Bearing Repack Guide`,category:`repair`,answer:`How Often to Repack Trailer Bearings:

The 12-month rule: Repack every 12 months or 12,000 miles — whichever comes first. If you submerge hubs (boat ramps), repack every 6 months.

Common bearing sizes by axle rating:
• 3,500 lb axle — Inner: L68149, Outer: L44649
• 5,200 lb axle — Inner: 25580, Outer: 15123
• 7,000 lb axle — Inner: 14125A, Outer: 25580 (note: same bearings as 5.2K but reversed positions)

Repack steps:
1. Remove hub, clean out all old grease
2. Inspect races and rollers for pitting, heat discoloration, or wear
3. Pack fresh grease into each roller by hand until it squeezes through
4. Install a NEW grease seal every time
5. Tighten spindle nut, back off 1/4 turn, install NEW cotter pin

⚠️ EZ-Lube zerks are for maintenance topping — they are NOT a substitute for a full repack. And that $0.50 cotter pin is the only thing keeping your wheel on the trailer.`},{id:`towing`,keywords:[`tow`,`gvwr`,`capacity`,`how much can`,`tow rating`,`weight limit`,`gcwr`],label:`Towing Capacity Guide`,category:`howto`,answer:`How to Determine Your Towing Capacity:

Your safe towing limit is the LOWEST of these three numbers:
1. Vehicle's tow rating (check door jamb sticker or owner's manual)
2. Hitch/receiver rating (stamped on the hitch)
3. Trailer's GVWR (Gross Vehicle Weight Rating — on the VIN plate)

Key weight terms:
• GVWR — Max total weight the trailer can carry (trailer + cargo)
• Dry Weight / Empty Weight — Trailer with no load
• Payload — GVWR minus empty weight = what you can actually load
• Tongue Weight — Should be 10–15% of total trailer weight

Example: Your truck is rated to tow 7,500 lbs. You're looking at a trailer with 7,000 lb GVWR. Technically under the limit — but with zero margin. Factor in passengers, fuel, gear in the truck bed, and you may already be over.

⚠️ Exceeding tow ratings voids insurance coverage in most cases. If you're within 500 lbs of any limit, size up.`},{id:`lights`,keywords:[`light`,`not working`,`dim`,`flicker`,`led`,`bulb`,`marker`,`tail light`,`turn signal`],label:`Trailer Light Troubleshooting`,category:`repair`,answer:`Trailer Lights Not Working — Troubleshooting Guide:

Start here (fixes 80% of issues):
1. CHECK THE GROUND WIRE — Bad grounds cause more trailer light problems than anything else. The white wire must connect to clean, bare metal on both the trailer frame and vehicle frame.
2. Clean the plug/socket — Unplug the connector, spray with electrical contact cleaner, check for bent or corroded pins.
3. Check the vehicle fuse — A blown fuse on the tow vehicle side kills all trailer lights instantly. Check your owner's manual for the trailer fuse location.

If only SOME lights work:
• One light out → Replace the bulb. If still dead, check the socket for corrosion.
• Running lights work but no turn/brake → Check Pin 3 (right) and Pin 5 (left) on the 7-pin connector.
• Lights work when NOT connected to trailer → You have a short on the trailer side. Check where wires pass through frame holes — rubbed insulation is the #1 cause.

If lights are DIM or FLICKERING:
• Almost always a ground issue. Sand the ground contact point to bare metal and re-attach.
• On LED trailers: Verify your vehicle has an LED-compatible flasher relay.

⚠️ Never "test" trailer wiring by jumping pins with a screwdriver. Use a circuit tester or multimeter.`},{id:`tireload`,keywords:[`load range`,`ply`,`tire rating`,`st tire`,`blowout`,`tire pressure`,`tire replace`,`tire age`],label:`Tire Load Ranges Explained`,category:`specs`,answer:`Trailer Tire Load Ranges Explained:

Load Range tells you how much weight each tire can safely carry at its max rated pressure:
• Load Range B — 4 ply, ~1,000 lbs per tire (light utility only)
• Load Range C — 6 ply, ~1,820 lbs per tire (standard for 3,500 lb axles)
• Load Range D — 8 ply, ~2,205 lbs per tire (heavy bumper pull)
• Load Range E — 10 ply, ~2,830 lbs per tire (dump, gooseneck, heavy equipment)

Important rules:
• ST (Special Trailer) tires are designed for trailer use — do NOT use passenger (P) or light truck (LT) tires on trailers. ST tires have stiffer sidewalls to resist trailer sway.
• Always inflate to the pressure stamped on the sidewall (cold). Under-inflation is the #1 cause of trailer tire blowouts.
• Replace trailer tires every 5 years regardless of tread depth — the rubber degrades from UV and weather exposure.

⚠️ Trailer tires fail differently than truck tires. They don't "go flat slowly" — they shred. If you see sidewall cracking, bulges, or uneven wear, replace immediately.`},{id:`axle`,keywords:[`axle`,`single axle`,`tandem`,`axle weight`,`axle capacity`,`axle tube`,`axle size`],label:`Axle Weight Capacity`,category:`specs`,answer:`How to Determine Trailer Axle Weight Capacity:

Method 1 — Measure the axle tube diameter:
• 1.5" round — 1,000 lb axle
• 2" round — 2,000 lb axle
• 2-3/8" round — 3,500 lb axle
• 3" round — 5,200–6,000 lb axle
• 3.5" round — 7,000 lb axle

Method 2 — Count the leaf springs:
• 2-leaf — typically 2,000 lb
• 3-leaf — typically 3,500 lb
• 4-leaf or double-eye — 5,200–7,000 lb

Method 3 — Check the hub bolt pattern (see "Hub bolt patterns" topic)

Tandem vs Single Axle:
• Single axle = simpler, lighter, cheaper, easier to maneuver. Best under 3,500 lbs.
• Tandem axle = distributes weight across 4 tires, better stability at highway speeds, can still move if one tire blows. Required for loads over 3,500 lbs.

⚠️ The axle rating is NOT the same as the trailer's GVWR. A tandem 3,500 lb axle trailer (7,000 lb combined axle capacity) might only have a 7,000 lb GVWR — but the frame, coupler, and tires must all be rated for it too.`},{id:`maintenance`,keywords:[`maintenance`,`checklist`,`inspect`,`pre-trip`,`annual`,`monthly`,`routine`],label:`Maintenance Checklist`,category:`howto`,answer:`Trailer Maintenance Checklist — Before Every Trip:

PRE-TRIP (5 minutes):
□ Coupler fully seated and locked — pull up to verify
□ Safety chains crossed under coupler in an X pattern
□ Breakaway cable/switch connected to tow vehicle
□ All lights working: running, brake, turn, reverse
□ Tire pressure at sidewall spec (check COLD)
□ Lug nuts torqued — re-torque new wheels at 25, 50, and 100 miles
□ Load secured with rated straps — not bungees, not rope

MONTHLY:
□ Grease EZ-Lube zerks (if equipped)
□ Check tire sidewalls for cracking or bulges
□ Inspect brake magnets for wear (electric brakes)
□ Check wiring for chafing where it enters the frame

ANNUALLY:
□ Full bearing repack (see "How often to repack bearings" topic)
□ Brake adjustment and inspection
□ Check frame and tongue for cracks — especially at weld joints
□ Inspect springs and hangers for sagging or broken leaves
□ Replace breakaway battery if it won't hold a charge

⚠️ The #1 roadside failure we see at Midway: wheel studs snapping because lug nuts weren't re-torqued after a tire change. Takes 2 minutes. Do it.`},{id:`coupler`,keywords:[`coupler`,`2 inch`,`2-5/16`,`coupler size`,`coupler replace`,`ball size`,`hitch ball`],label:`Coupler Sizes & Replacement`,category:`specs`,answer:`Trailer Coupler Sizes — 2" vs 2-5/16" Ball:

Common coupler/ball sizes:
• 1-7/8" ball — Light-duty (up to 2,000 lbs GVWR). Small utility trailers and lawn equipment.
• 2" ball — Most widely used. Supports medium-duty trailers up to about 8,000 lbs. Standard for utility, cargo, car haulers, and most bumper pull trailers.
• 2-5/16" ball — Heavy-duty. Rated up to 20,000 lbs. Required for heavy equipment, gooseneck (with adapter), and large dump trailers.

⚠️ NEVER mix ball and coupler sizes. A 2" ball in a 2-5/16" coupler will appear to latch but can pop free under load. This is one of the most common causes of trailer disconnection on the road.

When to replace your coupler:
• Visible wear or egg-shaping in the ball socket
• Latch mechanism won't close or hold securely
• Cracks in the coupler body or weld points
• Excessive side-to-side play when latched onto the ball

Replacement types:
• Bolt-on coupler — Bolted to the tongue with 2–4 bolts. Easy DIY replacement.
• Weld-on coupler — Welded directly to the tongue. Requires cutting and re-welding.

Sources: Lippert (lippert.com), CURT Mfg (curtmfg.com), etrailer.com`},{id:`sway`,keywords:[`sway`,`fishtail`,`weight distribution`,`wd hitch`,`wobble`,`unstable`,`wag`,`serpentine`],label:`Trailer Sway & Weight Distribution`,category:`safety`,answer:`Trailer Sway — Causes, Prevention, and Emergency Response:

Common causes:
• Tongue weight too light (below 10% of trailer weight) — most common cause
• Load shifted too far back in the trailer
• Crosswinds or turbulence from passing semis
• Excessive speed (sway risk increases dramatically above 55 mph)
• Under-inflated tires or mismatched tire pressure side-to-side
• Worn suspension components (springs, shocks, bushings)

Prevention:
• Load 60% of cargo weight forward of the trailer's center axle
• Tongue weight should be 10–15% of the total loaded trailer weight
• Use a weight distribution hitch on any bumper pull trailer over 5,000 lbs
• Consider a sway control device (friction bar or integrated WDH)
• Check tire pressure before every trip — match side-to-side exactly
• Stay under 65 mph when towing, especially in wind

If sway starts while driving:
1. Do NOT slam the brakes — this makes sway worse
2. Let off the gas gradually
3. If you have a brake controller, apply ONLY the trailer brakes gently (manual override)
4. Keep the steering wheel straight — do NOT try to counter-steer
5. The trailer will straighten itself as speed drops

⚠️ A weight distribution hitch with integrated sway control (like Equal-i-zer or Blue Ox) is one of the best safety investments for any bumper pull trailer. Cost: $400–$800 installed.

Sources: Weigh-Safe (weigh-safe.com), Equal-i-zer Hitch (equalizerhitch.com), Blue Ox (blueox.com)`},{id:`tongue_weight`,keywords:[`tongue weight`,`how to measure tongue`,`tongue scale`,`nose weight`,`tongue heavy`,`tongue light`],label:`Measuring Tongue Weight`,category:`howto`,answer:`How to Measure Trailer Tongue Weight:

Tongue weight is the downward force at the coupler when hitched. It should be 10–15% of total loaded trailer weight. Too little causes sway; too much overloads your rear axle and lifts your front end.

Method 1 — Tongue Weight Scale (most accurate):
Place a dedicated tongue weight scale under the trailer jack on level ground. Read directly. Cost: $30–$60.

Method 2 — Bathroom Scale (trailers under 300 lbs tongue weight):
Place the trailer coupler directly on a bathroom scale on level ground. Read directly.

Method 3 — Bathroom Scale + Lever (heavier trailers):
1. Place a sturdy 2x4 or pipe on the ground under the coupler
2. Set a bathroom scale about 2 feet from the coupler
3. Place a fulcrum (brick or block) about 1 foot from the coupler
4. Lower the coupler onto the 2x4
5. Multiply the scale reading by 3 = tongue weight

Method 4 — Commercial Vehicle Scale:
1. Weigh your truck WITHOUT the trailer
2. Hitch the trailer, with trailer wheels on the ground but NOT on the scale
3. Weigh the truck again
4. Difference = tongue weight

Quick rule of thumb: If your truck squats noticeably in the rear and the headlights point upward, tongue weight is too high. If the truck feels light in the rear and the trailer wanders, tongue weight is too low.

Sources: CURT Mfg (curtmfg.com), Weigh-Safe (weigh-safe.com), Blue Ox (blueox.com)`},{id:`breakaway`,keywords:[`breakaway`,`breakaway switch`,`breakaway battery`,`breakaway cable`,`breakaway kit`,`emergency brake`],label:`Breakaway Switch & Battery`,category:`safety`,answer:`Trailer Breakaway Switch — How It Works, Testing, and Maintenance:

What it does: If your trailer separates from the tow vehicle while moving, the breakaway cable pulls a pin from the switch. This completes a circuit between a dedicated 12V battery and the trailer's electric brakes, locking them up and stopping the trailer.

How to test (do this at least twice a year):
1. Hitch the trailer to your truck on flat ground
2. Unplug the trailer's 7-pin connector from the truck
3. Pull the breakaway pin straight out of the switch (takes ~40 lbs of force)
4. Try to drive forward slowly — the trailer wheels should lock
5. If the trailer rolls freely, the breakaway system is DEAD — do not tow until fixed

Common failure causes:
• Dead battery — #1 issue. The small 12V gel battery inside the breakaway box dies from sitting unused. Replace every 2–3 years or when it won't hold a charge.
• Corroded connections — Clean the battery terminals and wire connections annually
• Broken cable — Check the cable for fraying where it attaches to the tow vehicle
• Stuck pin — Corrosion can seize the pin. Pull and re-insert it periodically with a spray of WD-40.

⚠️ Breakaway systems are REQUIRED by law on any trailer with electric brakes in Tennessee and most states. A failed breakaway is a DOT violation and an insurance liability.

Battery note: If your breakaway kit includes a charger wire (connected to Pin 6 of the 7-pin plug), the battery charges while towing. If there's no charger, you must remove and charge the battery manually every few months.

Sources: Keystone RV (keystonerv.com), etrailer.com, Lippert (lippert.com)`},{id:`safety_chains`,keywords:[`safety chain`,`chain cross`,`chain length`,`chain rating`,`chain hook`,`cross chain`],label:`Safety Chains — Proper Use`,category:`safety`,answer:`Trailer Safety Chains — How to Attach Correctly:

The rule: ALWAYS cross safety chains under the trailer tongue in an X pattern.

Why cross them?
If the coupler separates from the ball, the crossed chains create a cradle that catches the tongue before it hits the pavement. Uncrossed chains allow the tongue to drop and dig into the road — causing a violent stop or rollover.

Proper length:
• Chains must be long enough to allow full turns without binding
• But short enough that they don't drag on the ground
• The lowest point of the crossed chains should clear the ground by 4–6 inches
• To test: hitch up and turn the truck to full lock in both directions — chains should be taut but not straining

How to check length before buying:
Hitch the trailer and turn it to near-jackknife position. That's the maximum stretch the chains will see. They should reach without pulling tight.

Adjusting excess length:
• Hook to a link farther down the chain (don't let excess drag)
• Use a chain hanger or heavy zip tie to secure slack
• NEVER twist chains to shorten them — twisting reduces strength by up to 75%

Chain ratings:
• Grade 30 (proof coil) — Light duty, up to 4,500 lbs per chain
• Grade 43 (high test) — Medium duty, 5,400–16,200 lbs
• Grade 70 (transport chain) — Heavy duty, DOT rated for load securement

⚠️ Both chains must be attached every time you tow — no exceptions. It's state law in Tennessee and every other state.

Sources: CURT Mfg (curtmfg.com), DOT/FMCSA securement regulations, etrailer.com`},{id:`floor`,keywords:[`floor`,`deck`,`wood floor`,`steel floor`,`diamond plate`,`deck board`,`rot`,`floor replace`,`treated wood`,`plywood`],label:`Floor Replacement — Wood vs Steel`,category:`repair`,answer:`Trailer Floor Replacement — Treated Wood vs Steel Diamond Plate:

TREATED WOOD (most common replacement):
• Cost: $200–$500 for a full deck (materials + labor varies)
• Lifespan: 15+ years with #1 grade ACQ pressure-treated lumber; 20 years with occasional retreatment
• Standard size: 2x8 or 2x6 boards, cut to fit between crossmembers
• Pros: Cheap, easy to DIY, provides natural traction even when wet, simple to replace individual boards
• Cons: Will eventually rot if water sits on it, heavier than you'd think, termites in some regions

STEEL DIAMOND PLATE:
• Cost: ~$35 per running foot installed (e.g., $700 for a 20ft trailer)
• Lifespan: Essentially permanent if kept painted or coated
• Typical thickness: .100" (10 gauge) for trailer floors
• Pros: Never rots, handles chemical spills, great for dump trailers, welds to crossmembers for added frame strength
• Cons: Heavier (2–4x the weight of wood), slippery when wet, more expensive, harder to repair if dented

PLYWOOD (enclosed cargo trailers):
• Standard: 3/4" exterior-grade plywood
• Used in: Enclosed cargo trailers (floors and walls)
• Replacement cost: $300–$600 for a 7x16 cargo trailer floor
• Tip: Use marine-grade plywood if the trailer will see moisture

Which to choose at Midway:
• Equipment / flatbed / utility → treated pine (standard, easy to maintain)
• Dump trailer → steel diamond plate (handles the abuse)
• Enclosed cargo → 3/4" exterior plywood (lighter, clean surface)

Sources: NC4x4 forum, TractorByNet forum, SizeMetal.com`},{id:`jack`,keywords:[`jack`,`tongue jack`,`drop leg`,`swivel jack`,`hydraulic jack`,`crank`,`jack type`,`landing gear`],label:`Trailer Jack Types`,category:`specs`,answer:`Trailer Jack Types — Which One Do You Need?

TOP-WIND JACK (most basic):
• How it works: Crank handle on top, screw mechanism raises/lowers
• Capacity: 2,000–5,000 lbs
• Best for: Light utility, cargo, car hauler trailers
• Pros: Cheap ($30–$60), simple, reliable
• Cons: Slow — lots of cranking, especially on tall trucks

DROP-LEG JACK (most popular upgrade):
• How it works: Telescoping inner leg drops via a pin, then a crank fine-tunes height
• Capacity: 2,000–10,000 lbs
• Best for: Equipment trailers, any trailer that requires lifting from ground level
• Pros: Saves 2–3 minutes of cranking per hitch/unhitch. Pin drops the leg 6–9" instantly.
• Cons: Costs ~70% more than a top-wind ($50–$100). Pin holes can get packed with dirt.
• Tip: Spray the inner tube with silicone lubricant every few months.

SWIVEL JACK:
• How it works: Jack pivots to horizontal position when towing for ground clearance
• Capacity: 1,000–1,500 lbs
• Best for: Boat trailers, small utility where clearance over ramps matters
• Pros: Won't drag on boat ramps or steep driveways. Often includes a caster wheel for easy maneuvering.
• Cons: Lower weight capacity than other types

HYDRAULIC / ELECTRIC JACK:
• How it works: Push-button operation via 12V power
• Capacity: 3,500–12,000 lbs
• Best for: Gooseneck trailers (dual hydraulic jacks), heavy equipment trailers, frequent hitch/unhitch
• Pros: Effortless lifting, fast
• Cons: Most expensive ($150–$500+). Requires 12V power source. More parts to fail.

Sources: Trailer Valet (trailervalet.com), Trailer Streets (trailerstreets.com), etrailer.com`},{id:`surge_vs_electric`,keywords:[`surge brake`,`surge vs electric`,`hydraulic brake`,`brake type`,`electric brake`,`brake controller`,`brake difference`],label:`Surge Brakes vs Electric Brakes`,category:`specs`,answer:`Surge Brakes vs Electric Brakes — Which System Is Better?

ELECTRIC BRAKES (what Midway primarily sells):
• How they work: A brake controller in your truck sends electric current to electromagnets in each brake drum. You control the intensity.
• Pros:
  — Instant response when you press the brake pedal
  — Adjustable braking force via controller (dial up for heavy loads, down for empty)
  — Independent trailer brake activation — apply trailer brakes only to correct sway
  — Works with breakaway switch for emergency disconnection
  — Easier and cheaper to service
• Cons: Requires a brake controller installed in the tow vehicle ($50–$200) and a working 7-pin connection

SURGE BRAKES (hydraulic):
• How they work: When the truck slows, the trailer pushes against the coupler, which compresses a hydraulic cylinder in the tongue. This hydraulic pressure activates the brakes.
• Pros:
  — No controller or wiring needed — completely self-contained
  — Popular on boat trailers because they're more water-resistant
  — Good for rentals or frequently switching between tow vehicles
• Cons:
  — No independent brake control — you can't apply trailer brakes separately
  — Brakes engage when REVERSING (trailer pushes coupler = brakes activate). Requires a lockout pin to back up.
  — On long downhills, brakes are constantly applied → overheating and fade
  — Most surge systems don't include breakaway protection
  — Less effective at controlling sway

Midway's recommendation: Electric brakes for any work trailer. The ability to independently apply trailer brakes and adjust for load weight makes them far safer for hauling equipment on Tennessee's hills and grades.

Sources: Equal-i-zer Hitch (equalizerhitch.com), Load'em Up Trailers, Felling Trailers (felling.com)`},{id:`leaf_spring`,keywords:[`leaf spring`,`spring sag`,`spring broke`,`spring replace`,`suspension`,`ride rough`,`bounce`,`lean`,`shackle`,`equalizer`,`hanger`],label:`Leaf Spring Diagnosis`,category:`repair`,answer:`Trailer Leaf Spring Problems — Signs, Diagnosis, and Replacement:

Signs your leaf springs need attention:
• Trailer sits lower on one side
• Springs have gone flat or lost their arch
• Visible cracks or broken leaves in the spring pack
• Trailer bounces excessively or rides rough over bumps
• Uneven tire wear (especially inner or outer edge wear)
• New swaying behavior that wasn't there before
• Clunking or squeaking noises over bumps
• Reduced clearance between tire and fender

It might NOT be the springs:
The same symptoms can come from worn bushings, stretched shackles, tired equalizers, or loose U-bolts. Before replacing springs, check:
• Shackle bolts for wear and play
• Equalizer bars for cracks (especially at weld joints)
• U-bolts for proper torque
• Bushings for cracking or deformation

Spring replacement basics:
• Match the spring exactly: number of leaves, length, width, eye type (standard eye vs double eye), and weight rating
• Always replace springs in PAIRS — don't put a new spring on one side and keep the old one on the other
• Re-torque U-bolts after 100 miles of driving with new springs

Cost estimate: $100–$200 per spring (parts) + $150–$300 labor per pair at a shop like Midway.

⚠️ A broken leaf spring can cause the axle to shift, which throws off alignment, chews up tires, and can cause a wheel to contact the fender. Don't drive on a broken spring — get it fixed.

Sources: etrailer.com, RVLiving.com, AutoZone, General Spring (generalspringkc.com)`},{id:`registration`,keywords:[`registration`,`title`,`tag`,`plate`,`register`,`tennessee`,`tn`,`county clerk`,`mso`,`vin`],label:`TN Registration & Title`,category:`legal`,answer:`Trailer Registration & Title in Tennessee:

DO I NEED TO REGISTER MY TRAILER IN TN?
It depends on use and type:

• Personal-use utility trailers — Tennessee does NOT require title or registration for utility trailers used for private/personal purposes, as long as you're towing behind a TN-licensed vehicle.
• Commercial-use trailers — Any trailer used for business purposes MUST be titled and registered, regardless of size.
• Freight, semi, and pole trailers — Must be registered with appropriate plates.
• Trailers over 8ft wide and 20ft long (not counting tongue) — Require a semi tag.

To register (when required):
1. Visit your county clerk's office
2. Bring: MSO (Manufacturer's Statement of Origin) or existing title, dealer invoice, and proof of sales tax payment
3. Pay registration fee (varies by trailer type — typically $28–$76 for standard plates)
4. Receive your plate

Buying a used trailer privately:
• Seller must provide a signed title (or bill of sale for untitled trailers)
• If the trailer was never titled in TN, you may need a VIN inspection from your county clerk
• Sales tax is due at time of registration

Midway's role: When you buy from us, we handle the MSO, sales tax collection, and can assist with registration paperwork. Bedford County Clerk's office is in Shelbyville, about 8 miles from our lot.

⚠️ Even if registration isn't required for personal utility trailers, having a title is strongly recommended for proof of ownership and insurance purposes. If your trailer is stolen and has no title, recovery is much harder.

Sources: Tennessee Dept. of Revenue (revenue.support.tn.gov), TN Highway Patrol (tn.gov/safety)`},{id:`tiedown`,keywords:[`tie down`,`ratchet strap`,`chain binder`,`strap rating`,`securement`,`dot strap`,`load secure`,`strap broke`,`wll`,`working load`],label:`Tie-Down & Load Securement`,category:`howto`,answer:`Tie-Down & Load Securement — DOT Requirements and Best Practices:

THE 50% RULE (most important thing to know):
Your total tie-down working load limit (WLL) must equal at least 50% of the cargo weight. Example: hauling a 6,000 lb skid steer → you need 3,000 lbs of total WLL across all tie-downs.

Minimum tie-down counts:
• Under 5ft long, under 1,100 lbs → 1 tie-down
• Under 5ft long, over 1,100 lbs → 2 tie-downs
• Over 5ft long, up to 10,000 lbs → 2 tie-downs (1 on each end)
• Over 10,000 lbs → minimum 4 tie-downs at independent corners

Ratchet straps vs chains:
• Ratchet straps — Lighter, faster, easier on painted surfaces. WLL typically 2,000–5,000 lbs. Replace every 90 days of heavy use or immediately if cut, frayed, or UV-damaged.
• Chains with load binders — Stronger, more durable, DOT standard for heavy equipment. Grade 70 transport chain is rated for load securement. Use lever binders or ratchet binders to tension.
• Use corner protectors with straps to prevent cutting on sharp metal edges.

Common strap sizes:
• 2" strap — WLL ~3,333 lbs (10,000 lb breaking strength)
• 4" strap — WLL ~5,400 lbs (16,200 lb breaking strength)
• Standard lengths: 27ft or 30ft for flatbed winch straps

⚠️ Bungee cords and rope are NOT rated tie-downs. DOT can fine you $1,000+ per unsecured load violation, and you're personally liable for anything that comes off your trailer.

Sources: FMCSA/DOT securement regulations, RatchetStrapsUSA.com, MyTeeProducts.com`},{id:`fender`,keywords:[`fender`,`fender type`,`fender replace`,`mud flap`,`steel fender`,`aluminum fender`,`plastic fender`,`fender dent`],label:`Fender Types & Replacement`,category:`repair`,answer:`Trailer Fender Types — Steel vs Aluminum vs Plastic:

STEEL FENDERS (most common on work trailers):
• Pros: Toughest — resists dents and impacts well. Cheapest option. Available in many styles.
• Cons: Will rust if coating is damaged. Heaviest option. Must be painted or galvanized.
• Best for: Dump trailers, equipment trailers, any trailer that takes abuse.
• Maintenance: Touch up paint chips promptly. Spray underside with rust inhibitor annually.

ALUMINUM FENDERS:
• Pros: Won't rust. Lighter than steel. Clean look that lasts.
• Cons: Most expensive. Dents and bends more easily than steel. Harder to repair.
• Best for: Enclosed cargo trailers, car haulers, show trailers.

PLASTIC / POLY FENDERS:
• Pros: Cheapest. Lightest. Can't rust. Easy bolt-on installation.
• Cons: Can crack in cold weather or from impact. UV degrades over time. Looks less professional.
• Best for: Light utility trailers, boat trailers, temporary replacements.

Sizing:
• Single axle fenders — One arch per wheel
• Tandem fenders — Long fender that covers both wheels, with a step or flat section between
• Measure tire-to-tire (outermost point) and allow 1–2" clearance on each side

When to replace:
• Bent or cracked fender that no longer covers the tire (road debris hazard)
• Rust-through holes on steel fenders
• Missing fender — driving without fenders throws rocks, mud, and water at other vehicles

Midway stocks replacement fenders for most common trailer sizes. Bring your trailer in and we can match the fit.

Sources: Hawaypart.com, etrailer.com, RecStuff.com`},{id:`winch_strap`,keywords:[`winch`,`winch strap`,`flatbed strap`,`car strap`,`vehicle strap`,`ratchet flatbed`,`strap replace`,`strap size`],label:`Winch Straps for Flatbeds`,category:`howto`,answer:`Winch Straps — Choosing the Right Strap for Your Flatbed or Car Hauler:

Common sizes:
• 2" wide — WLL ~3,333 lbs. Good for car haulers and light flatbeds.
• 4" wide — WLL ~5,400 lbs. Standard for commercial flatbed trucking.
• Standard lengths: 27ft and 30ft

Material: Polyester webbing — high strength with minimal stretch. Do not use nylon (too stretchy) or polypropylene (UV-weak).

End fittings:
• Flat hook — Most common for flatbed winches
• Wire hook / double-J hook — Good for anchor points and stake pockets
• Chain and hook — Heavy equipment applications
• Loop end — For threading through D-rings

When to replace:
• Visible cuts, fraying, or abrasion on the webbing
• Burn marks from friction against sharp edges
• UV fading — if the strap has lost color significantly, it's lost strength
• Professional flatbed drivers replace straps every 90 days of regular use
• Any strap that's been shock-loaded (snapped tight from a sudden stop) — replace it

Pro tips:
• ALWAYS use corner protectors when straps cross sharp metal edges — this is the #1 cause of strap failure
• Store straps dry and out of UV light when not in use
• Inspect the ratchet mechanism too — a stuck or corroded ratchet is as dangerous as a bad strap
• For car hauling, use wheel tie-down straps with basket-style wheel nets — they're faster and don't scratch rims
